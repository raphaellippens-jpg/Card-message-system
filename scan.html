<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Scan Card — Card Message System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <strong>🪪 Card Message System</strong>

        <div class="nav-links">
            <a class="button secondary" href="index.html">
                Home
            </a>
        </div>
    </nav>

    <main>

        <section
            class="panel center"
            style="max-width:600px;margin:60px auto;"
        >

            <h1>📷 Scan a Card</h1>

            <p>
                Open your device's <strong>Camera</strong> app
                and point it at the QR code on the card.
            </p>

            <div
                class="cms-card"
                style="margin-top:24px;"
            >

                <h2>📱 What to do</h2>

                <p>
                    Open the Camera app → point it at
                    the QR code → tap the link that appears.
                </p>

            </div>

            <p class="status">
                The QR code will automatically open
                the card's page.
            </p>

        </section>

    </main>

</body>

</html>
