
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Scan Card — Card Message System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <strong>🪪 Card Message System</strong>

        <div class="nav-links">
            <a
                class="button secondary"
                href="index.html"
            >
                Home
            </a>
        </div>
    </nav>


    <main>

        <section
            class="panel center"
            style="max-width:650px;margin:40px auto;"
        >

            <h1>📷 Scan a Card</h1>

            <p>
                Use your device's Camera app to scan
                the QR code on the card.
            </p>


            <div
                class="cms-card"
                style="margin-top:24px;"
            >

                <h2>How to scan</h2>

                <p>
                    1. Open the <strong>Camera</strong> app.
                </p>

                <p>
                    2. Point it at the QR code.
                </p>

                <p>
                    3. Tap the notification/link that
                    appears.
                </p>

            </div>


            <p
                class="status"
                style="margin-top:24px;"
            >
                📱 The Camera app will handle the QR scan.
            </p>


            <a
                class="button secondary"
                href="index.html"
                style="margin-top:16px;"
            >
                ← Back Home
            </a>

        </section>

    </main>

</body>

</html>
