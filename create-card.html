<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card Message System — Create Card</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <h1>Create a New Card</h1>

    <p>
        This creates a completely new card linked to your account.
        Your old card's data will NOT be copied.
    </p>

    <button id="createButton">
        Create Card
    </button>

    <p id="status"></p>

    <button id="backButton">
        Back to Dashboard
    </button>

    <script src="config.js"></script>
    <script src="supabase.js"></script>

    <script>
        const createButton = document.getElementById("createButton");
        const status = document.getElementById("status");

        function generateCardCode() {
            const characters =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            const randomValues =
                crypto.getRandomValues(new Uint32Array(12));

            let code = "";

            for (let i = 0; i < randomValues.length; i++) {
                code += characters[
                    randomValues[i] % characters.length
                ];
            }

            return (
                code.substring(0, 4) + "-" +
                code.substring(4, 8) + "-" +
                code.substring(8, 12)
            );
        }

        createButton.addEventListener("click", async () => {
            createButton.disabled = true;
            status.textContent = "Creating card...";

            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();

            if (userError || !user) {
                status.textContent = "You are not logged in.";
                createButton.disabled = false;
                return;
            }

            const cardCode = generateCardCode();

            const { data: card, error: cardError } =
                await supabaseClient
                    .from("cards")
                    .insert({
                        owner_id: user.id,
                        card_code: cardCode
                    })
                    .select()
                    .single();

            if (cardError) {
                status.textContent =
                    "Could not create card: " + cardError.message;

                createButton.disabled = false;
                return;
            }

            status.innerHTML = `
                Card created successfully!<br><br>
                Your card code is:
                <strong>${card.card_code}</strong>
            `;

            createButton.disabled = false;
        });

        document.getElementById("backButton")
            .addEventListener("click", () => {
                window.location.href = "dashboard.html";
            });
    </script>

</body>
</html>
