<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Card — Card Message System</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <nav>

        <strong>🪪 Card Message System</strong>

        <div class="nav-links">

            <a
                class="button secondary"
                href="dashboard.html"
            >
                Dashboard
            </a>

        </div>

    </nav>


    <main>

        <section
            class="panel center"
            style="max-width:600px;margin:50px auto;"
        >

            <h1>🪪 Create a Card</h1>

            <p>
                Create a completely new card connected
                to your account.
            </p>

            <p>
                Your existing cards and their data
                will <strong>not</strong> be copied.
            </p>


            <div
                class="cms-card"
                style="margin:24px 0;"
            >

                <h2>What you'll get</h2>

                <p>
                    🔢 A unique card code
                </p>

                <p>
                    📱 A QR code
                </p>

                <p>
                    ✏️ Your own card data
                </p>

                <p>
                    🖨️ A printable card
                </p>

            </div>


            <button
                id="createButton"
                style="margin-top:10px;"
            >
                ➕ Create Card
            </button>


            <p
                id="status"
                class="status"
            >
                Ready.
            </p>


            <a
                id="backButton"
                class="button secondary"
                href="dashboard.html"
                style="margin-top:12px;"
            >
                ← Back to Dashboard
            </a>

        </section>

    </main>


    <script src="config.js"></script>
    <script src="supabase.js"></script>
    <script src="card-data.js"></script>


    <script>

        const createButton =
            document.getElementById(
                "createButton"
            );

        const status =
            document.getElementById(
                "status"
            );


        function generateCardCode() {

            const characters =
                "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


            const randomValues =
                crypto.getRandomValues(
                    new Uint32Array(12)
                );


            let code = "";


            for (
                let i = 0;
                i < randomValues.length;
                i++
            ) {

                code +=
                    characters[
                        randomValues[i] %
                        characters.length
                    ];

            }


            return (
                code.substring(0, 4) +
                "-" +
                code.substring(4, 8) +
                "-" +
                code.substring(8, 12)
            );

        }


        createButton.addEventListener(
            "click",
            async () => {

                createButton.disabled =
                    true;

                status.textContent =
                    "Creating card...";

                status.className =
                    "status";


                const {
                    data: { user },
                    error: userError
                } =
                    await supabaseClient
                        .auth
                        .getUser();


                if (
                    userError ||
                    !user
                ) {

                    status.textContent =
                        "You are not logged in.";

                    status.className =
                        "status error";

                    createButton.disabled =
                        false;

                    return;

                }


                const cardCode =
                    generateCardCode();


                const {
                    data: card,
                    error: cardError
                } =
                    await supabaseClient
                        .from("cards")
                        .insert({
                            owner_id:
                                user.id,

                            card_code:
                                cardCode
                        })
                        .select()
                        .single();


                if (cardError) {

                    status.textContent =
                        "Could not create card: " +
                        cardError.message;

                    status.className =
                        "status error";

                    createButton.disabled =
                        false;

                    return;

                }


                try {

                    await initializeCardData(
                        card.id
                    );


                    status.innerHTML = `

                        <strong>
                            ✅ Card created!
                        </strong>

                        <br><br>

                        Your card code:

                        <br>

                        <span class="card-code">
                            ${card.card_code}
                        </span>

                        <br><br>

                        <a
                            class="button"
                            href="card.html?id=${card.id}"
                        >
                            Open Card
                        </a>

                    `;

                    status.className =
                        "status success";


                } catch (error) {

                    status.textContent =
                        "Card was created, but its data could not be initialized: " +
                        error.message;

                    status.className =
                        "status error";

                }


                createButton.disabled =
                    false;

            }
        );

    </script>

</body>

</html>
