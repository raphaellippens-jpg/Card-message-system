<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Card Message System — Account</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <nav>
        <strong>🪪 Card Message System</strong>

        <div class="nav-links">
            <a class="button secondary" href="index.html">
                Home
            </a>
        </div>
    </nav>

    <main>

        <section class="panel" style="max-width: 520px; margin: 40px auto;">

            <div class="center">

                <h1>Welcome back.</h1>

                <p>
                    Log in to manage your cards,
                    or create an account to get started.
                </p>

            </div>

            <h2>Log in</h2>

            <form id="loginForm">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="loginPassword">
                    Password
                </label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Log in
                </button>

            </form>

            <div class="spacer"></div>

            <h2>Create account</h2>

            <form id="signupForm">

                <label for="signupEmail">
                    Email
                </label>

                <input
                    id="signupEmail"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="signupPassword">
                    Password
                </label>

                <input
                    id="signupPassword"
                    type="password"
                    placeholder="At least 6 characters"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button type="submit">
                    Create account
                </button>

            </form>

            <p id="message" class="status">
                Ready.
            </p>

        </section>

    </main>

    <script src="config.js"></script>
    <script src="supabase.js"></script>

    <script>
        const loginForm =
            document.getElementById("loginForm");

        const signupForm =
            document.getElementById("signupForm");

        const message =
            document.getElementById("message");

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                message.textContent =
                    "Logging in...";

                const email =
                    document.getElementById(
                        "loginEmail"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "loginPassword"
                    ).value;

                const { error } =
                    await supabaseClient.auth
                        .signInWithPassword({
                            email,
                            password
                        });

                if (error) {
                    message.textContent =
                        error.message;

                    message.className =
                        "status error";

                    return;
                }

                message.textContent =
                    "Login successful.";

                message.className =
                    "status success";

                window.location.href =
                    "dashboard.html";
            }
        );

        signupForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                message.textContent =
                    "Creating account...";

                const email =
                    document.getElementById(
                        "signupEmail"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "signupPassword"
                    ).value;

                const { data, error } =
                    await supabaseClient.auth
                        .signUp({
                            email,
                            password
                        });

                if (error) {
                    message.textContent =
                        error.message;

                    message.className =
                        "status error";

                    return;
                }

                message.className =
                    "status success";

                if (
                    data.user &&
                    data.session
                ) {
                    message.textContent =
                        "Account created. Redirecting...";

                    window.location.href =
                        "dashboard.html";
                } else {
                    message.textContent =
                        "Account created. Check your email to confirm your account.";
                }
            }
        );
    </script>

</body>
</html>
