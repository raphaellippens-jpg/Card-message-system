<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Card Message System — Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>

        .dashboard-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card-preview {
            padding: 16px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #1d2230,
                    #151922
                );

            border: 1px solid var(--border);

            min-height: 120px;

            overflow: hidden;
        }

        .card-preview-title {
            font-size: 18px;
            font-weight: 800;

            margin-bottom: 5px;

            word-break: break-word;
        }

        .card-preview-name {
            font-size: 12px;

            color: var(--muted);

            margin-bottom: 12px;

            word-break: break-word;
        }

        .card-preview-message {
            color: var(--text);

            white-space: pre-wrap;

            word-break: break-word;

            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;

            overflow: hidden;
        }

        .card-preview-empty {
            color: var(--muted);

            font-style: italic;
        }

        .card-actions {
            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        .card-actions .button {
            flex: 1;
        }

        .card-meta {
            display: flex;

            flex-direction: column;

            gap: 4px;
        }

        @media (max-width: 600px) {

            .card-actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

    <nav>

        <strong>
            🪪 Card Message System
        </strong>

        <div class="nav-links">

            <a
                class="button secondary"
                href="index.html"
            >
                Home
            </a>

            <button
                id="logoutButton"
                class="danger"
            >
                Log out
            </button>

        </div>

    </nav>


    <main>


        <!-- ACCOUNT -->

        <section class="panel">

            <h1>
                Dashboard
            </h1>

            <p id="account">
                Loading account...
            </p>

        </section>


        <div class="spacer"></div>


        <!-- CARDS -->

        <section class="panel">

            <div class="row">

                <div>

                    <h2>
                        Your Cards
                    </h2>

                    <p>
                        View and manage your cards
                        and see what's inside them.
                    </p>

                </div>


                <button
                    id="createCardButton"
                >
                    ➕ Create New Card
                </button>

            </div>


            <div
                id="cards"
                class="card-grid"
                style="margin-top:24px;"
            >
                Loading cards...
            </div>


            <p
                id="message"
                class="status"
            >
                Loading...
            </p>

        </section>


    </main>


    <script src="config.js"></script>

    <script src="supabase.js"></script>


    <script>

        const account =
            document.getElementById(
                "account"
            );


        const cardsContainer =
            document.getElementById(
                "cards"
            );


        const message =
            document.getElementById(
                "message"
            );



        async function loadDashboard() {

            /*
             * GET USER
             */

            const {
                data: {
                    user
                },
                error: userError
            } =
                await supabaseClient
                    .auth
                    .getUser();


            if (
                userError ||
                !user
            ) {

                window.location.href =
                    "auth.html";

                return;

            }


            account.textContent =
                `Logged in as ${user.email}`;



            /*
             * GET CARDS
             */

            const {
                data: cards,
                error: cardsError
            } =
                await supabaseClient
                    .from("cards")
                    .select(
                        `
                            id,
                            card_code,
                            created_at,
                            card_data (
                                id,
                                data,
                                updated_at
                            )
                        `
                    )
                    .eq(
                        "owner_id",
                        user.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (cardsError) {

                cardsContainer.textContent =
                    "Could not load cards: " +
                    cardsError.message;

                message.textContent =
                    "There was a problem loading your cards.";

                message.className =
                    "status error";

                return;

            }



            /*
             * NO CARDS
             */

            if (
                !cards ||
                cards.length === 0
            ) {

                cardsContainer.innerHTML = `

                    <div class="cms-card">

                        <h3>
                            No cards yet
                        </h3>

                        <p>
                            Create your first card
                            to get started.
                        </p>

                    </div>

                `;


                message.textContent =
                    "You don't have any cards yet.";

                message.className =
                    "status";


                return;

            }



            /*
             * BUILD CARD LIST
             */

            cardsContainer.innerHTML =
                "";


            cards.forEach(
                card => {

                    /*
                     * SUPABASE RETURNS THE
                     * RELATION AS AN ARRAY
                     */

                    let cardData =
                        null;


                    if (
                        Array.isArray(
                            card.card_data
                        ) &&
                        card.card_data.length
                    ) {

                        cardData =
                            card.card_data[0];

                    }


                    else if (
                        card.card_data
                    ) {

                        cardData =
                            card.card_data;

                    }


                    const data =
                        cardData?.data || {};


                    const title =
                        data.title ||
                        "Card Message";


                    const name =
                        data.name ||
                        "";


                    const text =
                        data.text ||
                        "";


                    const cardElement =
                        document.createElement(
                            "div"
                        );


                    cardElement.className =
                        "cms-card dashboard-card";



                    /*
                     * CONTENT PREVIEW
                     */

                    let previewHTML = "";


                    if (
                        title ||
                        name ||
                        text
                    ) {

                        previewHTML = `

                            <div
                                class="card-preview"
                            >

                                <div
                                    class="card-preview-title"
                                >
                                    ${escapeHTML(
                                        title
                                    )}
                                </div>


                                ${
                                    name
                                        ? `
                                            <div
                                                class="card-preview-name"
                                            >
                                                👤
                                                ${escapeHTML(
                                                    name
                                                )}
                                            </div>
                                          `
                                        : ""
                                }


                                ${
                                    text
                                        ? `
                                            <div
                                                class="card-preview-message"
                                            >
                                                ${escapeHTML(
                                                    text
                                                )}
                                            </div>
                                          `
                                        : `
                                            <div
                                                class="card-preview-empty"
                                            >
                                                This card
                                                doesn't have
                                                a message yet.
                                            </div>
                                          `
                                }

                            </div>

                        `;

                    }



                    else {

                        previewHTML = `

                            <div
                                class="card-preview"
                            >

                                <div
                                    class="card-preview-empty"
                                >
                                    This card is empty.
                                </div>

                            </div>

                        `;

                    }



                    cardElement.innerHTML = `

                        <div>

                            <h3>
                                🪪 Card
                            </h3>


                            <p>
                                Code:
                            </p>


                            <span
                                class="card-code"
                            >
                                ${escapeHTML(
                                    card.card_code
                                )}
                            </span>

                        </div>


                        ${previewHTML}


                        <div class="card-meta">

                            <p>
                                📅 Created:
                                ${new Date(
                                    card.created_at
                                ).toLocaleString()}
                            </p>

                        </div>


                        <div class="card-actions">

                            <a
                                class="button"
                                href="card.html?id=${encodeURIComponent(
                                    card.id
                                )}"
                            >
                                ✏️ Open Card
                            </a>


                            <a
                                class="button secondary"
                                href="card-print.html?id=${encodeURIComponent(
                                    card.id
                                )}"
                            >
                                🎨 Design Card
                            </a>

                        </div>

                    `;


                    cardsContainer.appendChild(
                        cardElement
                    );

                }
            );


            message.textContent =
                `${cards.length} card${
                    cards.length === 1
                        ? ""
                        : "s"
                } found.`;


            message.className =
                "status success";

        }



        /*
         * HTML ESCAPING
         *
         * Prevents card data from being
         * interpreted as HTML.
         */

        function escapeHTML(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                String(value);


            return div.innerHTML;

        }



        /*
         * LOG OUT
         */

        document
            .getElementById(
                "logoutButton"
            )
            .addEventListener(
                "click",
                async () => {

                    await supabaseClient
                        .auth
                        .signOut();


                    window.location.href =
                        "auth.html";

                }
            );



        /*
         * CREATE CARD
         */

        document
            .getElementById(
                "createCardButton"
            )
            .addEventListener(
                "click",
                () => {

                    window.location.href =
                        "create-card.html";

                }
            );



        loadDashboard();

    </script>

</body>

</html>
