<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Card — Card Message System</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>


<body>

    <nav>

        <strong>🪪 Card Message System</strong>

        <div class="nav-links">

            <a
                class="button secondary"
                href="index.html"
            >
                Home
            </a>

        </div>

    </nav>


    <main>

        <!-- NORMAL CARD VIEW -->

        <section
            id="cardPanel"
            class="panel"
            style="max-width:700px;margin:40px auto;"
        >

            <h1>🪪 Card</h1>

            <p>
                Card code:
            </p>

            <span
                id="cardCode"
                class="card-code"
            >
                Loading...
            </span>


            <div
                id="cardData"
                class="cms-card"
                style="margin-top:24px;"
            >
                Loading card data...
            </div>


            <div
                id="cardActions"
                class="row"
                style="margin-top:24px;"
            >

                <button id="exportButton">
                    📤 Export Data
                </button>

                <a
                    class="button secondary"
                    href="scan.html"
                >
                    📷 Scan Another Card
                </a>

            </div>


            <p
                id="status"
                class="status"
            >
                Loading...
            </p>

        </section>


        <!-- ACCESS DENIED -->

        <section
            id="deniedPanel"
            class="panel center"
            style="
                max-width:600px;
                margin:60px auto;
                display:none;
            "
        >

            <h1>🔒 Access Denied</h1>

            <p>
                You are not authorized to view this card.
            </p>

            <p>
                Ask the card owner to add your account
                as an authorized user.
            </p>


            <div
                class="cms-card"
                style="margin-top:24px;"
            >

                <p>
                    Card code:
                </p>

                <span
                    id="deniedCode"
                    class="card-code"
                >
                    Unknown
                </span>

            </div>


            <div
                class="row"
                style="margin-top:24px;"
            >

                <a
                    class="button"
                    href="auth.html"
                >
                    👤 Log In
                </a>

                <a
                    class="button secondary"
                    href="scan.html"
                >
                    📷 Scan Another Card
                </a>

            </div>

        </section>

    </main>


    <script src="config.js"></script>
    <script src="supabase.js"></script>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        const code =
            params.get("code");


        const cardPanel =
            document.getElementById(
                "cardPanel"
            );


        const deniedPanel =
            document.getElementById(
                "deniedPanel"
            );


        const cardCode =
            document.getElementById(
                "cardCode"
            );


        const deniedCode =
            document.getElementById(
                "deniedCode"
            );


        const cardData =
            document.getElementById(
                "cardData"
            );


        const status =
            document.getElementById(
                "status"
            );


        const exportButton =
            document.getElementById(
                "exportButton"
            );


        let publicData = null;



        function showDenied() {

            cardPanel.style.display =
                "none";

            deniedPanel.style.display =
                "block";

            deniedCode.textContent =
                code || "Unknown";

        }



        async function loadCard() {

            if (!code) {

                showDenied();

                return;

            }


            cardCode.textContent =
                code;


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "get_public_card_data",
                    {
                        requested_card_code:
                            code
                    }
                );


            if (error) {

                console.error(error);


                showDenied();

                return;

            }


            /*
             * The database returns null when
             * the user isn't authorized.
             */

            if (!data) {

                showDenied();

                return;

            }


            publicData =
                data;


            const actualData =
                data.data || {};


            cardData.innerHTML =
                "";


            if (
                typeof actualData.text ===
                    "string" &&
                actualData.text.trim() !== ""
            ) {

                const title =
                    document.createElement(
                        "h2"
                    );


                title.textContent =
                    "💬 Message";


                cardData.appendChild(
                    title
                );


                const text =
                    document.createElement(
                        "p"
                    );


                text.textContent =
                    actualData.text;


                text.style.whiteSpace =
                    "pre-wrap";


                text.style.fontSize =
                    "1.15rem";


                cardData.appendChild(
                    text
                );

            } else {

                const empty =
                    document.createElement(
                        "p"
                    );


                empty.textContent =
                    "This card doesn't have any data yet.";


                cardData.appendChild(
                    empty
                );

            }


            status.textContent =
                "Card loaded.";

            status.className =
                "status success";

        }



        exportButton.addEventListener(
            "click",
            () => {

                if (!publicData) {
                    return;
                }


                const file =
                    new Blob(
                        [
                            JSON.stringify(
                                publicData,
                                null,
                                2
                            )
                        ],
                        {
                            type:
                                "application/json"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        file
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    `card-${code}.json`;


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();


                URL.revokeObjectURL(
                    url
                );

            }
        );


        loadCard();

    </script>

</body>

</html>
