<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Public Card — Card Message System</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <nav>
        <strong>🪪 Card Message System</strong>

        <div class="nav-links">
            <a
                class="button secondary"
                href="index.html"
            >
                Home
            </a>
        </div>
    </nav>


    <main>

        <section
            class="panel"
            style="max-width:700px;margin:40px auto;"
        >

            <h1>Card Information</h1>

            <p>
                Card:
                <span
                    id="cardCode"
                    class="card-code"
                >
                    Loading...
                </span>
            </p>


            <div
                id="cardData"
                class="cms-card"
                style="margin-top:24px;"
            >
                Loading card data...
            </div>


            <div
                class="row"
                style="margin-top:24px;"
            >

                <button id="exportButton">
                    📤 Export Data
                </button>

                <a
                    class="button secondary"
                    href="scan.html"
                >
                    📷 Scan Another Card
                </a>

            </div>


            <p
                id="status"
                class="status"
            >
                Loading...
            </p>

        </section>

    </main>


    <script src="config.js"></script>
    <script src="supabase.js"></script>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const code =
            params.get("code");


        const cardCode =
            document.getElementById(
                "cardCode"
            );

        const cardData =
            document.getElementById(
                "cardData"
            );

        const status =
            document.getElementById(
                "status"
            );

        const exportButton =
            document.getElementById(
                "exportButton"
            );


        let publicData = null;



        async function loadCard() {

            if (!code) {

                cardCode.textContent =
                    "Unknown";

                cardData.textContent =
                    "No card code was provided.";

                status.textContent =
                    "Card code missing.";

                status.className =
                    "status error";

                return;
            }


            cardCode.textContent =
                code;


            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "get_public_card_data",
                    {
                        requested_card_code:
                            code
                    }
                );


            if (error) {

                cardData.textContent =
                    "Could not load card.";

                status.textContent =
                    error.message;

                status.className =
                    "status error";

                return;
            }


            if (!data) {

                cardData.textContent =
                    "Card not found.";

                status.textContent =
                    "This card does not exist.";

                status.className =
                    "status error";

                return;
            }


            publicData = data;


            const actualData =
                data.data || {};


            cardData.innerHTML = "";


            if (
                typeof actualData.text ===
                "string" &&
                actualData.text.trim() !== ""
            ) {

                const title =
                    document.createElement(
                        "h2"
                    );

                title.textContent =
                    "💬 Message";

                cardData.appendChild(
                    title
                );


                const text =
                    document.createElement(
                        "p"
                    );

                text.textContent =
                    actualData.text;

                text.style.whiteSpace =
                    "pre-wrap";

                text.style.fontSize =
                    "1.15rem";

                cardData.appendChild(
                    text
                );

            } else {

                const empty =
                    document.createElement(
                        "p"
                    );

                empty.textContent =
                    "This card doesn't have any public data yet.";

                cardData.appendChild(
                    empty
                );

            }


            status.textContent =
                "Card loaded.";

            status.className =
                "status success";

        }



        exportButton.addEventListener(
            "click",
            () => {

                if (!publicData) {
                    return;
                }


                const file =
                    new Blob(
                        [
                            JSON.stringify(
                                publicData,
                                null,
                                2
                            )
                        ],
                        {
                            type:
                                "application/json"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        file
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href = url;

                link.download =
                    `card-${code}.json`;


                link.click();


                URL.revokeObjectURL(
                    url
                );

            }
        );


        loadCard();

    </script>

</body>

</html>
