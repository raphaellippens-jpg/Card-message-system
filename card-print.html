<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Print Card — Card Message System</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        #card {
            width: 350px;
            height: 220px;
            margin: 30px auto;
            border: 2px solid black;
            border-radius: 18px;
            padding: 20px;
            box-sizing: border-box;
            background: white;
            color: black;
        }

        #card h2 {
            margin-top: 10px;
            margin-bottom: 8px;
        }

        #cardCode {
            font-size: 14px;
            letter-spacing: 2px;
        }

        #qrcode {
            margin: 15px auto 0;
            width: 100px;
            height: 100px;
        }

        @media print {
            body {
                padding: 0;
            }

            body > *:not(#card) {
                display: none;
            }

            #card {
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <h1>Printable Card</h1>

    <p id="status">Loading...</p>

    <div id="card" hidden>

        <h2 id="accountName">Card Message System</h2>

        <div id="cardCode"></div>

        <div id="qrcode"></div>

    </div>

    <button id="printButton" hidden>
        Print Card
    </button>

    <button id="dashboardButton">
        Dashboard
    </button>

    <script src="config.js"></script>
    <script src="supabase.js"></script>

    <script>
        const params =
            new URLSearchParams(window.location.search);

        const cardId = params.get("id");

        const status =
            document.getElementById("status");

        const card =
            document.getElementById("card");

        const accountName =
            document.getElementById("accountName");

        const cardCode =
            document.getElementById("cardCode");

        const qrCode =
            document.getElementById("qrcode");

        const printButton =
            document.getElementById("printButton");

        async function loadCard() {
            if (!cardId) {
                status.textContent =
                    "No card was specified.";

                return;
            }

            const {
                data: { user },
                error: userError
            } = await supabaseClient.auth.getUser();

            if (userError || !user) {
                window.location.href =
                    "auth.html";

                return;
            }

            const { data: cardData, error } =
                await supabaseClient
                    .from("cards")
                    .select(
                        "id, card_code, owner_id"
                    )
                    .eq("id", cardId)
                    .maybeSingle();

            if (error || !cardData) {
                status.textContent =
                    "Card not found.";

                return;
            }

            if (cardData.owner_id !== user.id) {
                status.textContent =
                    "You do not own this card.";

                return;
            }

            /*
             * The physical card contains only the
             * card identifier.
             *
             * The actual data stays in Supabase.
             */

            const scanURL =
                window.location.origin +
                window.location.pathname
                    .replace(
                        "card-print.html",
                        "scan-result.html"
                    ) +
                "?code=" +
                encodeURIComponent(
                    cardData.card_code
                );

            accountName.textContent =
                user.email;

            cardCode.textContent =
                cardData.card_code;

            new QRCode(qrCode, {
                text: scanURL,
                width: 100,
                height: 100
            });

            card.hidden = false;
            printButton.hidden = false;
            status.textContent =
                "Your card is ready to print.";
        }

        printButton.addEventListener(
            "click",
            () => {
                window.print();
            }
        );

        document
            .getElementById("dashboardButton")
            .addEventListener(
                "click",
                () => {
                    window.location.href =
                        "dashboard.html";
                }
            );

        loadCard();
    </script>

</body>
</html>
